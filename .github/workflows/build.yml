name: Build and test Ecru
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned test dependencies
        run: zsh Scripts/setup-tests.sh
      - name: Build native Dev from a clean dependency graph
        run: zsh Scripts/build.sh
      - name: Core, current ink, recovery restart, search and complex PDF regressions
        run: zsh Scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ matrix.runner }}
          path: .build/test-results/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Synthetic-PDF-diagnostics-${{ matrix.runner }}
          path: .build/pdf-save-*.pdf
          include-hidden-files: true
