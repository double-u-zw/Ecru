name: Build and test Ecru
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python3 -m pip install -r Tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .build/native-ink
          key: native-${{ matrix.runner }}-${{ env.ImageVersion }}-${{ hashFiles('Sources/Native/**', 'ThirdParty/**') }}
      - name: Build runner architecture
        run: ECRU_RELEASE=1 zsh Scripts/build.sh
      - name: Core tests on the runner architecture
        run: ECRU_TEST_DIAGNOSTICS=1 zsh Scripts/test.sh
      - name: Package architecture DMG
        run: ECRU_RELEASE_DOCS="$PWD" zsh Scripts/package-beta.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Synthetic-PDF-diagnostics-${{ matrix.runner }}
          path: .build/pdf-save-*.pdf
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Ecru-${{ matrix.runner }}
          path: output/releases/*/
